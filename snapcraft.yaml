name: tabletop-club-unofficial
title: Tabletop Club (Unofficial)
base: core24
version: 0.1.5
summary: An open-source multiplayer tabletop simulator
description: |
    Tabletop Club is an open-source multiplayer game that allows you to play your favorite tabletop games in a physics-driven 3D environment with the use of easy-to-make asset packs.

    Source: https://github.com/drwhut/tabletop-club
    Snap-Source: https://github.com/nbuechner/tabletop-club-snap

license: MIT
contact: https://github.com/nbuechner/tabletop-club-snap/issues
issues: https://github.com/nbuechner/tabletop-club-snap/issues
source-code: https://github.com/nbuechner/tabletop-club-snap
website: https://github.com/drwhut/tabletop-club

grade: stable
confinement: strict
platforms:
  amd64:

apps:
  tabletop-club:
    command: TabletopClub.x86_64
    plugs: [home, x11, desktop, removable-media, shared-memory, opengl, network, audio-playback ]
    extensions: [ gnome ]
    environment:
       VK_ICD_FILENAMES: "/var/lib/snapd/lib/vulkan/icd.d/nvidia_icd.json:$SNAP/usr/share/vulkan/icd.d/radeon.x86_64.json:$SNAP/usr/share/vulkan/icd.d/intel_icd.x86_64.json"

plugs:
  shared-memory:
    private: true

parts:
  main:
    source: https://github.com/drwhut/tabletop-club/releases/download/v${SNAPCRAFT_PROJECT_VERSION}/TabletopClub_v${SNAPCRAFT_PROJECT_VERSION}_Linux_64.zip
    plugin: dump
    source-type: zip
    stage-packages:
       - libgbm1
       - libgtk-3-0
       - libxrandr2
       - libnss3
       - libnotify4
       - libxss1
       - libxtst6
       - xdg-utils
       - libatspi2.0-0
       - libuuid1
       - libsecret-1-0
       - libappindicator3-1
       - desktop-file-utils
       - libvulkan1
       - mesa-vulkan-drivers

  asset-one:
    after: [ main ]
    source: .
    plugin: dump
    source-type: local
    override-build: |
       mkdir -p assets
       cd assets
       tar xf /root/project/snap/local/assets/ColorfulCards.tgz
       cd ..
       craftctl default

lint:
  ignore:
    - library

layout:
  /snap/tabletop-club-unofficial/Resources/assets:
    bind: $SNAP/assets
  /usr/share/vulkan:
    symlink: $SNAP/usr/share/vulkan
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvulkan_intel.so:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvulkan_intel.so
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvulkan_radeon.so:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvulkan_lvp.so
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvulkan_lvp.so:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvulkan_lvp.so
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLX_nvidia.so.0:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLX_nvidia.so.0
  /usr/share/libdrm:
    bind: $SNAP/usr/share/libdrm
